
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description"
        content="J2TS — An open-source Java to TypeScript transpiler.">

  <title>J2TS — Java to TypeScript Transpiler</title>

  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0d1117;
      color: #e6edf3;
    }

    main {
      max-width: 680px;
      padding: 40px 24px;
      text-align: center;
    }

    h1 {
      font-size: clamp(4rem, 12vw, 7rem);
      margin: 0;
      letter-spacing: -0.06em;
    }

    .tagline {
      font-size: 1.5rem;
      color: #8b949e;
    }

    p {
      line-height: 1.7;
    }

    a {
      display: inline-block;
      margin-top: 24px;
      padding: 12px 24px;
      background: #238636;
      color: white;
      text-decoration: none;
      border-radius: 6px;
      font-weight: 600;
    }

    a:hover {
      background: #2ea043;
    }
  </style>
</head>
<body>
  <main>
    <h1>J2TS</h1>
    <div class="tagline">Java → TypeScript</div>

    <p>
      An open-source transpiler for converting Java
      source code into TypeScript.
    </p>

    <p>Project under development.</p>

    <a href="https://github.com/java2typescript/j2ts">
      View on GitHub
    </a>
  </main>
</body>
</html>
